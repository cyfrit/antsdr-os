# SPDX-License-Identifier: MIT
schema_version: 1

# AntSDR OS uses a Debian-style public release number.  The OS generation is
# the compatibility boundary; board and upstream coordinates are recorded
# separately in generated build metadata.
product:
  name: AntSDR OS
  slug: antsdr-os
  major: 1
  point: 2
  version: "1.2"
  abi: 1
  channel: stable

supported_boards:
  - id: e310
    hardware_revision: revc
    artifact_id: e310-revc

compatibility:
  boot_abi: 1
  qspi_layout: 1
  uenv_abi: 1
  profile_schema: 1

upstream:
  adi_release: v0.39

artifacts:
  name_template: "{product}-{version}-{target}-adi-{adi_release}"
  tag_template: "{product}-{version}"
