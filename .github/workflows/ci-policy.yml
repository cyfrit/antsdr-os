# SPDX-License-Identifier: MIT
name: ANTSDR OS policy CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antsdr-os-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Actions and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate every workflow policy
        run: python tools/validate_workflows.py
      - name: Audit SPDX and license inventory
        run: python tools/license_audit.py check
      - name: Check patch and source hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E '(^|[[:space:]])(wget|curl)[[:space:]].*http://' -- boards release
          ! git grep -n -E '(^|[^A-Za-z])(md5|md5sum)([^A-Za-z]|$)' -- boards release
