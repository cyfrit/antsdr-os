name: temporary publish test

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing successful build run ID
        required: true
        type: string
      tag:
        description: Temporary release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: verified-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - name: Create temporary draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-bundle"
          test "$(find "$release_dir" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary publish test" \
            --notes "Temporary validation; this release is deleted after verification." \
            --draft \
            "$release_dir"/*
