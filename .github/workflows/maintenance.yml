# SPDX-License-Identifier: MIT
name: ANTSDR OS maintenance

on:
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antsdr-os-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-sources:
    name: Check pinned ADI overlays
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source and nested upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Recheck every overlay against its exact source commit
        shell: bash
        run: |
          set -euo pipefail
          for component in hdl linux u_boot buildroot; do
            python tools/prepare_component.py e310 "$component" --check
          done
      - name: Recheck contracts and licenses
        run: |
          python tools/validate_boards.py
          python tools/validate_workflows.py
          python tools/license_audit.py check
