# SPDX-License-Identifier: MIT
name: ANTSDR OS reproducibility

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: ANTSDR OS version to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: antsdr-os-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  first:
    name: Independent build A
    uses: ./.github/workflows/build-e310.yml
    with:
      version: ${{ inputs.version }}
      build_label: reproducibility-a
      uenv_mode: compat
  second:
    name: Independent build B
    uses: ./.github/workflows/build-e310.yml
    with:
      version: ${{ inputs.version }}
      build_label: reproducibility-b
      uenv_mode: compat
  compare:
    name: Compare normalized release inventories
    needs: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download build A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.first.outputs.artifact_name }}
          path: ${{ runner.temp }}/build-a
      - name: Download build B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.second.outputs.artifact_name }}
          path: ${{ runner.temp }}/build-b
      - name: Compare release inventories
        run: python tools/compare_reproducibility.py --first "$RUNNER_TEMP/build-a/release" --second "$RUNNER_TEMP/build-b/release"
