# SPDX-License-Identifier: MIT
# TEMPORARY DIAGNOSTIC: remove after the native runner cleanup policy is fixed.
name: TEMPORARY native runner storage diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antsdr-os-native-storage-diagnostics
  cancel-in-progress: true

jobs:
  inspect:
    name: Inspect native standard-8 storage
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Report runner and filesystem topology
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '=== operating system ==='
          cat /etc/os-release
          uname -a
          printf '\n%s\n' '=== cpu and memory ==='
          nproc
          free -h
          printf '\n%s\n' '=== block devices ==='
          lsblk -e7 -o NAME,TYPE,SIZE,FSTYPE,FSAVAIL,FSUSE%,MOUNTPOINTS
          printf '\n%s\n' '=== mounted filesystems ==='
          findmnt -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL,USE%,OPTIONS
          printf '\n%s\n' '=== filesystem capacity ==='
          df -hT
          printf '\n%s\n' '=== inode capacity ==='
          df -ih

      - name: Report large preinstalled directories
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '=== root directory totals, same filesystem only ==='
          sudo du -x -BM --max-depth=1 / 2>/dev/null | sort -n

          printf '\n%s\n' '=== tool and service directory totals ==='
          for path in \
            /opt \
            /usr \
            /usr/local \
            /usr/share \
            /var \
            /var/lib \
            /home \
            /mnt; do
            if [ -d "$path" ]; then
              printf '\n--- %s ---\n' "$path"
              sudo du -x -BM --max-depth=1 "$path" 2>/dev/null | sort -n | tail -n 40
            fi
          done

      - name: Report known cleanup candidates
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /usr/share/dotnet
            /usr/local/lib/android
            /opt/ghc
            /opt/hostedtoolcache/CodeQL
            /opt/hostedtoolcache
            /usr/local/.ghcup
            /usr/share/swift
            /usr/local/lib/node_modules
            /usr/local/share/powershell
            /usr/local/aws-cli
            /opt/az
            /opt/google
            /opt/microsoft
            /opt/pipx
            /usr/lib/jvm
            /var/cache/apt
            /var/lib/apt/lists
            /var/lib/docker
          )
          for path in "${candidates[@]}"; do
            if [ -e "$path" ]; then
              sudo du -x -sh "$path" 2>/dev/null || true
            else
              printf 'missing\t%s\n' "$path"
            fi
          done

      - name: Report largest installed packages and files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '=== 100 largest Debian packages, installed size in KiB ==='
          dpkg-query -Wf '${Installed-Size}\t${Package}\t${Version}\n' | sort -n | tail -n 100
          printf '\n%s\n' '=== files at least 512 MiB on the root filesystem ==='
          sudo find / -xdev -type f -size +512M -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -n 100

      - name: Report container storage
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker >/dev/null 2>&1; then
            sudo docker system df -v || true
            sudo docker image ls --digests --no-trunc || true
          else
            printf '%s\n' 'docker is not installed'
          fi
