# SPDX-License-Identifier: MIT
name: AntSDR OS release

on:
  push:
    tags:
      - 'antsdr-os-*'

permissions:
  contents: read

concurrency:
  group: antsdr-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check tag against release manifest
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_metadata.py check --tag "$GITHUB_REF_NAME"
          targets="$(python tools/release_metadata.py targets --build-label release)"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
  build:
    name: Build release source
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.preflight.outputs.targets) }}
    uses: ./.github/workflows/build-os.yml
    secrets: inherit
    with:
      board: ${{ matrix.target.board }}
      build_label: release
      uenv_mode: compat
      runner_mode: release-hosted
      release_signing: true
  verify:
    name: Verify release source
    needs: [preflight, build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.preflight.outputs.targets) }}
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      artifact_name: ${{ matrix.target.artifact_name }}
      board: ${{ matrix.target.board }}
  publish:
    name: Publish signed release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verified-*
          path: ${{ runner.temp }}/release-bundles
      - name: Assemble release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundles="$RUNNER_TEMP/release-bundles"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          mapfile -t checksums < <(find "$bundles" -name SHA256SUMS -type f -print | sort)
          ((${#checksums[@]} > 0))
          for checksum_file in "${checksums[@]}"; do
            bundle="$(dirname "$checksum_file")"
            (cd "$bundle" && sha256sum -c SHA256SUMS)
            metadata="$bundle/build-metadata.json"
            test -f "$metadata"
            target="$(python - "$metadata" <<'PY'
          import json
          import re
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8")).get("hardware_target", "")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", value):
              raise SystemExit("invalid hardware target in build metadata")
          print(value)
          PY
          )"
            mapfile -t archives < <(find "$bundle" -maxdepth 1 -name '*.zip' -type f -print | sort)
            ((${#archives[@]} > 0))
            for archive in "${archives[@]}"; do
              destination="$release_dir/$(basename "$archive")"
              test ! -e "$destination"
              cp "$archive" "$destination"
            done
            cp "$bundle/manifest.json" "$release_dir/${target}-manifest.json"
            cp "$metadata" "$release_dir/${target}-build-metadata.json"
            cp "$bundle/sbom.spdx.json" "$release_dir/${target}-sbom.spdx.json"
            if [ -e "$release_dir/antsdr-os-release.crt" ]; then
              cmp "$bundle/antsdr-os-release.crt" "$release_dir/antsdr-os-release.crt"
            else
              cp "$bundle/antsdr-os-release.crt" "$release_dir/antsdr-os-release.crt"
            fi
          done
          python - "$release_dir" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          lines = []
          for path in sorted(
              item
              for item in root.iterdir()
              if item.is_file() and item.name not in {"SHA256SUMS", "SHA256SUMS.sig"}
          ):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Sign and verify release checksums
        env:
          FIT_SIGNING_KEY_PEM: ${{ secrets.FIT_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/antsdr-os-release.key"
          pub="$RUNNER_TEMP/antsdr-os-release.pub"
          printf '%s' "$FIT_SIGNING_KEY_PEM" > "$key"
          openssl dgst -sha256 -sign "$key" \
            -out "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          openssl x509 -in "${{ steps.package.outputs.release_dir }}/antsdr-os-release.crt" \
            -pubkey -noout > "$pub"
          openssl dgst -sha256 -verify "$pub" \
            -signature "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          rm -f "$key" "$pub"
      - name: Attest release assets
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ steps.package.outputs.release_dir }}/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#antsdr-os-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AntSDR OS $version" \
            --generate-notes \
            "$RELEASE_DIR"/*
