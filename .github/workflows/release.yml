# SPDX-License-Identifier: MIT
name: ANTSDR OS release

on:
  push:
    tags:
      - 'e310-revc-os-*'

permissions:
  contents: read

concurrency:
  group: antsdr-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release source
    uses: ./.github/workflows/build-e310.yml
    secrets: inherit
    with:
      build_label: release
      uenv_mode: compat
      runner_mode: release-hosted
      release_signing: true
  verify:
    name: Verify release source
    needs: build
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
  publish:
    name: Publish signed release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Locate release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-bundle"
          test "$(find "$release_dir" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test -f "$release_dir/SHA256SUMS"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Sign and verify release checksums
        env:
          FIT_SIGNING_KEY_PEM: ${{ secrets.FIT_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/antsdr-os-release.key"
          pub="$RUNNER_TEMP/antsdr-os-release.pub"
          printf '%s' "$FIT_SIGNING_KEY_PEM" > "$key"
          openssl dgst -sha256 -sign "$key" \
            -out "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          openssl x509 -in "${{ steps.package.outputs.release_dir }}/antsdr-os-release.crt" \
            -pubkey -noout > "$pub"
          openssl dgst -sha256 -verify "$pub" \
            -signature "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          rm -f "$key" "$pub"
      - name: Attest release assets
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ steps.package.outputs.release_dir }}/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*-os-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ANTSDR OS $version (E310 Rev.C)" \
            --generate-notes \
            "$RELEASE_DIR"/*.zip \
            "$RELEASE_DIR/manifest.json" \
            "$RELEASE_DIR/build-metadata.json" \
            "$RELEASE_DIR/sbom.spdx.json" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/SHA256SUMS.sig" \
            "$RELEASE_DIR/antsdr-os-release.crt"
