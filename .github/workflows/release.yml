# SPDX-License-Identifier: MIT
name: ANTSDR OS release

on:
  push:
    tags:
      - 'e310-revc-os-*'

permissions:
  contents: read

concurrency:
  group: antsdr-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check tag against release manifest
        run: python tools/release_metadata.py check --tag "$GITHUB_REF_NAME"
  build:
    name: Build release source
    needs: preflight
    uses: ./.github/workflows/build-e310.yml
    secrets: inherit
    with:
      build_label: release
      uenv_mode: compat
      runner_mode: release-hosted
      release_signing: true
  verify:
    name: Verify release source
    needs: build
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
  publish:
    name: Publish signed release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Locate release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-bundle"
          test "$(find "$release_dir" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test -f "$release_dir/SHA256SUMS"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Sign and verify release checksums
        env:
          FIT_SIGNING_KEY_PEM: ${{ secrets.FIT_SIGNING_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/antsdr-os-release.key"
          pub="$RUNNER_TEMP/antsdr-os-release.pub"
          printf '%s' "$FIT_SIGNING_KEY_PEM" > "$key"
          openssl dgst -sha256 -sign "$key" \
            -out "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          openssl x509 -in "${{ steps.package.outputs.release_dir }}/antsdr-os-release.crt" \
            -pubkey -noout > "$pub"
          openssl dgst -sha256 -verify "$pub" \
            -signature "${{ steps.package.outputs.release_dir }}/SHA256SUMS.sig" \
            "${{ steps.package.outputs.release_dir }}/SHA256SUMS"
          rm -f "$key" "$pub"
      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package.outputs.release_dir }}/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*-os-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ANTSDR OS $version (E310 Rev.C)" \
            --generate-notes \
            "$RELEASE_DIR"/*.zip \
            "$RELEASE_DIR/manifest.json" \
            "$RELEASE_DIR/build-metadata.json" \
            "$RELEASE_DIR/sbom.spdx.json" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/SHA256SUMS.sig" \
            "$RELEASE_DIR/antsdr-os-release.crt"
