# SPDX-License-Identifier: MIT
name: ANTSDR OS release

on:
  push:
    tags:
      - 'e310-revc-os-*'

permissions:
  contents: read

concurrency:
  group: antsdr-os-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release source
    uses: ./.github/workflows/build-e310.yml
    with:
      build_label: release
      uenv_mode: compat
  verify:
    name: Verify release source
    needs: build
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
  publish:
    name: Publish signed release
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Locate release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/release-bundle" -type f -name '*.tar.gz' -print -quit)"
          release_dir="$RUNNER_TEMP/release-bundle"
          test -n "$archive"
          test -f "$release_dir/SHA256SUMS"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
      - name: Attest release archive
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*-os-}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "ANTSDR OS $version (E310 Rev.C)" \
            --generate-notes \
            "$ARCHIVE" \
            "$RELEASE_DIR/manifest.json" \
            "$RELEASE_DIR/build-metadata.json" \
            "$RELEASE_DIR/sbom.spdx.json" \
            "$RELEASE_DIR/SHA256SUMS"
