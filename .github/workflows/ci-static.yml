# SPDX-License-Identifier: MIT
name: ANTSDR OS static CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antsdr-os-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Contract and test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install device-tree validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cpp device-tree-compiler zstd
      - name: Validate board contracts
        run: python tools/validate_boards.py
      - name: Validate release metadata
        run: python tools/release_metadata.py show --board e310 --format json
      - name: Validate FIT release public key
        run: >-
          python tools/verify_fit_release_key.py
          --certificate keys/fit/antsdr-os-release.crt
          --dtsi boards/e310/hw/uboot/dts/antsdr-os-release-key.dtsi
      - name: Run repository tests
        run: python -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')
      - name: Check whitespace
        run: git diff --check
