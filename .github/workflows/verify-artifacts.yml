# SPDX-License-Identifier: MIT
name: ANTSDR OS artifact verification

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    outputs:
      verified_artifact_name:
        description: Name of the verified artifact bundle
        value: ${{ jobs.verify.outputs.verified_artifact_name }}
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Build artifact to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: antsdr-os-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify E310 release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      verified_artifact_name: ${{ steps.bundle.outputs.verified_artifact_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/input
      - name: Verify manifest and generate release inventory
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/input/release"
          test -d "$release"
          python tools/verify_release.py --release "$release" --board e310
          mkdir -p "$RUNNER_TEMP/verified"
          python tools/package_release.py --release "$release" --output "$RUNNER_TEMP/verified"
          python tools/generate_sbom.py --release "$release" --output "$RUNNER_TEMP/verified/sbom.spdx.json"
          cp "$release/manifest.json" "$release/build-metadata.json" "$RUNNER_TEMP/verified/"
          cp keys/fit/antsdr-os-release.crt "$RUNNER_TEMP/verified/"
          python tools/write_checksums.py --root "$RUNNER_TEMP/verified"
      - name: Bundle verified artifacts
        id: bundle
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: echo "verified_artifact_name=verified-${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/verified
          if-no-files-found: error
          retention-days: 90
