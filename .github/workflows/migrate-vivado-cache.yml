# SPDX-License-Identifier: MIT
# TEMPORARY MIGRATION: remove after the unified Vivado cache is verified.
name: TEMPORARY migrate Vivado cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antsdr-os-vivado-cache-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Convert segmented cache to unified cache
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 45
    steps:
      - name: Check out cache configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install cache runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd

      - name: Resolve cache identities
        id: cache_keys
        shell: bash
        run: |
          set -euo pipefail
          segmented_digest="$(sha256sum \
            ci/vivado/web-installer.env \
            ci/vivado/install_config.txt.in \
            ci/vivado/toolchain-cache.sh | sha256sum | awk '{print $1}')"
          unified_digest="$(sha256sum \
            ci/vivado/web-installer.env \
            ci/vivado/install_config.txt.in \
            ci/vivado/install-vivado.sh | sha256sum | awk '{print $1}')"
          printf 'segmented=vivado-toolchain-x64-ubuntu2204-v3-%s\n' "$segmented_digest" >> "$GITHUB_OUTPUT"
          printf 'unified=vivado-toolchain-x64-ubuntu2204-v4-%s\n' "$unified_digest" >> "$GITHUB_OUTPUT"

      - name: Restore segmented cache manifest
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/cache/manifest
          key: ${{ steps.cache_keys.outputs.segmented }}-manifest-migration-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.segmented }}-manifest-
          fail-on-cache-miss: true

      - name: Read segmented cache generation
        id: generation
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/.toolchains/cache/manifest/toolchain.env"
          generation="$(sed -n 's/^generation=//p' "$manifest")"
          [[ "$generation" =~ ^[0-9]+$ ]]
          printf 'value=%s\n' "$generation" >> "$GITHUB_OUTPUT"

      - name: Restore segmented cache part 00
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/cache/parts/part-00
          key: ${{ steps.cache_keys.outputs.segmented }}-part-00-${{ steps.generation.outputs.value }}
          fail-on-cache-miss: true

      - name: Restore segmented cache part 01
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/cache/parts/part-01
          key: ${{ steps.cache_keys.outputs.segmented }}-part-01-${{ steps.generation.outputs.value }}
          fail-on-cache-miss: true

      - name: Restore segmented cache part 02
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/cache/parts/part-02
          key: ${{ steps.cache_keys.outputs.segmented }}-part-02-${{ steps.generation.outputs.value }}
          fail-on-cache-miss: true

      - name: Restore segmented cache part 03
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/cache/parts/part-03
          key: ${{ steps.cache_keys.outputs.segmented }}-part-03-${{ steps.generation.outputs.value }}
          fail-on-cache-miss: true

      - name: Reconstruct Xilinx toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash ci/vivado/toolchain-cache.sh restore \
            "$GITHUB_WORKSPACE/.toolchains/Xilinx" \
            "$GITHUB_WORKSPACE/.toolchains/cache"
          rm -rf "$GITHUB_WORKSPACE/.toolchains/cache"

      - name: Save unified Xilinx toolchain cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/Xilinx
          key: ${{ steps.cache_keys.outputs.unified }}

      - name: Verify unified Xilinx toolchain cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/Xilinx
          key: ${{ steps.cache_keys.outputs.unified }}
          lookup-only: true
          fail-on-cache-miss: true
