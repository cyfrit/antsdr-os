# SPDX-License-Identifier: MIT
name: ANTSDR OS E310 build

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      source_date_epoch:
        required: false
        type: string
        default: ''
      uenv_mode:
        required: false
        type: string
        default: compat
      build_label:
        required: false
        type: string
        default: release
      toolchain_only:
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: Name of the uploaded build artifact
        value: ${{ jobs.build.outputs.artifact_name }}
    secrets:
      R2_S3_API_URL:
        required: true
      R2_BUCKET:
        required: true
      R2_INSTALLER_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      AMD_USERNAME:
        required: true
      AMD_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: ANTSDR OS major.point version
        required: true
        type: string
      source_date_epoch:
        description: Reproducible Unix timestamp; blank uses the commit timestamp
        required: false
        default: ''
        type: string
      uenv_mode:
        description: U-Boot uEnv compatibility mode
        required: true
        default: compat
        type: choice
        options: [compat, locked]
      build_label:
        description: Unique label for repeated builds
        required: true
        default: manual
        type: string
      toolchain_only:
        description: Populate or verify the AMD toolchain cache without building firmware
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: antsdr-os-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_label || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build E310 Rev.C
    runs-on: ubicloud-standard-8-ubuntu-2204
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    env:
      TZ: UTC
      LANG: C
      LC_ALL: C
    steps:
      - name: Expand build filesystem
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
      - name: Check out build configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install AMD FPGA runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y expect libncurses5 libtinfo5
          command -v aws
      - name: Restore AMD FPGA toolchain cache
        id: vivado_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/Xilinx
          key: vivado-x64-ubuntu2204-${{ hashFiles('ci/vivado/web-installer.env', 'ci/vivado/install_config.txt.in') }}
      - name: Install AMD FPGA toolchain
        if: steps.vivado_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          R2_S3_API_URL: ${{ secrets.R2_S3_API_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_INSTALLER_KEY: ${{ secrets.R2_INSTALLER_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMD_USERNAME: ${{ secrets.AMD_USERNAME }}
          AMD_PASSWORD: ${{ secrets.AMD_PASSWORD }}
        run: bash ci/vivado/install-vivado.sh
      - name: Activate cached AMD FPGA toolchain
        if: steps.vivado_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source ci/vivado/web-installer.env
          install_root="$GITHUB_WORKSPACE/.toolchains/Xilinx"
          settings="$install_root/Vitis/$VIVADO_VERSION/settings64.sh"
          test -r "$settings"
          source "$settings"
          command -v vivado
          command -v xsct
          command -v bootgen
          vivado -version | grep -F "$VIVADO_VERSION"
          {
            printf 'VIVADO_SETTINGS=%s\n' "$settings"
            printf 'XILINX_INSTALL_ROOT=%s\n' "$install_root"
            printf 'ANTSDR_BUILD_ROOT=%s\n' "$GITHUB_WORKSPACE/.ci-build"
          } >> "$GITHUB_ENV"
      - name: Save AMD FPGA toolchain cache
        if: steps.vivado_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.toolchains/Xilinx
          key: ${{ steps.vivado_cache.outputs.cache-primary-key }}
      - name: Report toolchain capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          du -sh "$GITHUB_WORKSPACE/.toolchains"
      - name: Check out pinned component sources
        if: inputs.toolchain_only != true
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1
      - name: Report source capacity
        if: inputs.toolchain_only != true
        shell: bash
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE"
          du -sh upstream
      - name: Set up Python
        if: inputs.toolchain_only != true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        if: inputs.toolchain_only != true
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Resolve version and source identity
        if: inputs.toolchain_only != true
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_EPOCH: ${{ inputs.source_date_epoch || '' }}
          BUILD_LABEL: ${{ inputs.build_label || 'push' }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_NAME" == e310-revc-os-* ]]; then
            python tools/release_metadata.py check --tag "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME##*-os-}"
          elif [ -z "$version" ]; then
            version="$(python tools/release_metadata.py show --board e310 --format github | sed -n 's/^os_version=//p')"
          fi
          test -n "$version"
          epoch="$INPUT_EPOCH"
          if [ -z "$epoch" ]; then
            epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          fi
          export SOURCE_DATE_EPOCH="$epoch"
          python tools/release_metadata.py show --board e310 --version "$version" --channel stable > "$RUNNER_TEMP/build-metadata.json"
          python - "$RUNNER_TEMP/build-metadata.json" "$BUILD_LABEL" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          label = sys.argv[2]
          print(f"artifact_name={metadata['artifact_stem']}-{label}")
          print(f"version={metadata['os_version']}")
          PY
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "ANTSDR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Linux, Buildroot, U-Boot, FPGA and BOOT.BIN
        if: inputs.toolchain_only != true
        shell: bash
        env:
          UENV_MODE: ${{ inputs.uenv_mode || 'compat' }}
        run: |
          set -euo pipefail
          source "$VIVADO_SETTINGS"
          workspace="$ANTSDR_BUILD_ROOT/e310"
          export ADI_HDL_DIR="$workspace/src/hdl"
          export ANTSDR_OS_VERSION="$ANTSDR_VERSION"
          python tools/e310_build.py all \
            --workspace "$workspace" \
            --jobs "${RUNNER_NUM_CPUS:-4}" \
            --uenv-mode "$UENV_MODE" \
            --xsct xsct \
            --release "$RUNNER_TEMP/antsdr-e310-release" \
            --execute
      - name: Attach build metadata and verify assembly
        if: inputs.toolchain_only != true
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/antsdr-e310-release"
          cp "$RUNNER_TEMP/build-metadata.json" "$release/build-metadata.json"
          python tools/verify_release.py --release "$release" --board e310
          mkdir -p "$RUNNER_TEMP/antsdr-e310-package/release"
          cp -a "$release/." "$RUNNER_TEMP/antsdr-e310-package/release/"
      - name: Upload unmodified build output
        if: inputs.toolchain_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/antsdr-e310-package
          if-no-files-found: error
          retention-days: 14
