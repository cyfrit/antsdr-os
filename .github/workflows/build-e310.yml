# SPDX-License-Identifier: MIT
name: ANTSDR OS E310 build

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      source_date_epoch:
        required: false
        type: string
        default: ''
      uenv_mode:
        required: false
        type: string
        default: compat
      build_label:
        required: false
        type: string
        default: release
      toolchain_only:
        required: false
        type: boolean
        default: false
      debug_enabled:
        required: false
        type: boolean
        default: false
      runner_mode:
        required: false
        type: string
        default: hosted
      release_signing:
        required: false
        type: boolean
        default: false
    outputs:
      artifact_name:
        description: Name of the uploaded build artifact
        value: ${{ jobs.build.outputs.artifact_name }}
    secrets:
      R2_S3_API_URL:
        required: true
      R2_BUCKET:
        required: true
      R2_INSTALLER_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      AMD_USERNAME:
        required: true
      AMD_PASSWORD:
        required: true
      FIT_SIGNING_KEY_PEM:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: ANTSDR OS major.point version
        required: true
        type: string
      source_date_epoch:
        description: Reproducible Unix timestamp; blank uses the commit timestamp
        required: false
        default: ''
        type: string
      uenv_mode:
        description: U-Boot uEnv compatibility mode
        required: true
        default: compat
        type: choice
        options: [compat, locked]
      build_label:
        description: Unique label for repeated builds
        required: true
        default: manual
        type: string
      toolchain_only:
        description: Populate or verify the segmented AMD toolchain cache without building firmware
        required: true
        default: false
        type: boolean
      debug_enabled:
        description: Temporarily open a tmate shell after Vivado and source setup
        required: true
        default: false
        type: boolean
      runner_mode:
        description: Build runner and AMD toolchain storage mode
        required: true
        default: hosted
        type: choice
        options: [hosted, release-hosted, aliyun-persistent]
      release_signing:
        description: Require and apply the ANTSDR OS release FIT signature
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: antsdr-os-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_label || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build E310 Rev.C
    runs-on: ${{ inputs.runner_mode == 'aliyun-persistent' && 'self-hosted' || inputs.runner_mode == 'release-hosted' && 'ubicloud-standard-8-ubuntu-2204' || 'ubicloud-standard-4-ubuntu-2204' }}
    timeout-minutes: 90
    environment: ${{ inputs.release_signing && 'release' || '' }}
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    env:
      TZ: UTC
      LANG: C
      LC_ALL: C
    steps:
      - name: Check out build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve build locations
        id: toolchain_location
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.runner_mode }}" = aliyun-persistent ]; then
            install_root="$HOME/.local/share/antsdr-os/Xilinx"
            printf 'ANTSDR_PERSISTENT_TOOLCHAIN=1\n' >> "$GITHUB_ENV"
          else
            install_root="$GITHUB_WORKSPACE/.toolchains/Xilinx"
          fi
          printf 'ANTSDR_BUILD_ROOT=%s\n' "$RUNNER_TEMP/antsdr-os-build" >> "$GITHUB_ENV"
          printf 'XILINX_INSTALL_ROOT=%s\n' "$install_root" >> "$GITHUB_ENV"
          printf 'install-root=%s\n' "$install_root" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: inputs.toolchain_only != true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        if: inputs.toolchain_only != true
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Resolve version and source identity
        if: inputs.toolchain_only != true
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_EPOCH: ${{ inputs.source_date_epoch || '' }}
          BUILD_LABEL: ${{ inputs.build_label || 'push' }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_NAME" == e310-revc-os-* ]]; then
            python tools/release_metadata.py check --tag "$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME##*-os-}"
          elif [ -z "$version" ]; then
            version="$(python tools/release_metadata.py show --board e310 --format github | sed -n 's/^os_version=//p')"
          fi
          test -n "$version"
          epoch="$INPUT_EPOCH"
          if [ -z "$epoch" ]; then
            epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          fi
          export SOURCE_DATE_EPOCH="$epoch"
          python tools/release_metadata.py show --board e310 --version "$version" --channel stable > "$RUNNER_TEMP/build-metadata.json"
          python - "$RUNNER_TEMP/build-metadata.json" "$BUILD_LABEL" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          label = sys.argv[2]
          print(f"artifact_name={metadata['artifact_stem']}-{label}")
          print(f"version={metadata['os_version']}")
          PY
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "ANTSDR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check out pinned component sources
        if: inputs.toolchain_only != true
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1
      - name: Resolve hardware build cache identity
        if: inputs.toolchain_only != true
        id: hardware_cache_identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/hardware_cache.py identity \
            --output "$RUNNER_TEMP/hardware-cache-identity.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore FPGA and FSBL bundle
        if: inputs.toolchain_only != true
        id: hardware_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/antsdr-e310-hardware-cache
          key: ${{ steps.hardware_cache_identity.outputs.key }}
      - name: Validate FPGA and FSBL bundle
        if: inputs.toolchain_only != true
        id: hardware_cache_state
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [ "${{ steps.hardware_cache.outputs.cache-hit }}" = true ] && \
             python tools/hardware_cache.py validate \
               --bundle "$RUNNER_TEMP/antsdr-e310-hardware-cache" \
               --identity "$RUNNER_TEMP/hardware-cache-identity.json"; then
            valid=true
          else
            rm -rf "$RUNNER_TEMP/antsdr-e310-hardware-cache"
          fi
          printf 'valid=%s\n' "$valid" >> "$GITHUB_OUTPUT"
      - name: Resolve AMD toolchain cache identity
        if: >-
          inputs.runner_mode != 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true')
        id: amd_cache
        shell: bash
        run: |
          set -euo pipefail
          printf 'key=vivado-toolchain-x64-ubuntu2204-2023.2-zynq-v1\n' >> "$GITHUB_OUTPUT"
      - name: Prepare hosted build host
        if: inputs.runner_mode != 'aliyun-persistent'
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /var/lib/docker \
            /opt/hostedtoolcache/CodeQL

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc \
            bison \
            build-essential \
            cpio \
            device-tree-compiler \
            expect \
            file \
            flex \
            libelf-dev \
            libmpc-dev \
            libncurses5 \
            libssl-dev \
            libtinfo5 \
            rsync \
            unzip \
            wget \
            x11-utils \
            xauth \
            xvfb \
            zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          command -v aws
      - name: Prepare persistent build host
        if: inputs.runner_mode == 'aliyun-persistent'
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            awscli
            bc
            bison
            build-essential
            ca-certificates
            cpio
            curl
            device-tree-compiler
            expect
            file
            flex
            git
            gnupg
            libelf-dev
            libmpc-dev
            libncurses5
            libssl-dev
            libtinfo5
            rsync
            unzip
            wget
            x11-utils
            xauth
            xvfb
            xz-utils
            zstd
          )
          missing=()
          for package in "${packages[@]}"; do
            dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed' || \
              missing+=("$package")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "${missing[@]}"
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
          fi
          command -v aws
          command -v xlsclients
          command -v Xvfb
          command -v xvfb-run
      - name: Restore AMD FPGA toolchain cache
        if: >-
          inputs.runner_mode != 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true')
        id: toolchain_cache
        uses: ./.github/actions/vivado-cache-restore
        with:
          key: ${{ steps.amd_cache.outputs.key }}
          toolchain-root: ${{ steps.toolchain_location.outputs.install-root }}
      - name: Detect persistent AMD FPGA toolchain
        if: >-
          inputs.runner_mode == 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true')
        id: persistent_toolchain
        shell: bash
        run: |
          set -euo pipefail
          present=false
          if [ -r "$XILINX_INSTALL_ROOT/Vitis/2023.2/settings64.sh" ] && \
             [ -x "$XILINX_INSTALL_ROOT/Vivado/2023.2/bin/vivado" ] && \
             [ -x "$XILINX_INSTALL_ROOT/Vitis/2023.2/bin/xsct" ] && \
             [ -x "$XILINX_INSTALL_ROOT/Vivado/2023.2/bin/bootgen" ]; then
            present=true
          fi
          printf 'present=%s\n' "$present" >> "$GITHUB_OUTPUT"
      - name: Install AMD FPGA toolchain
        if: >-
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true') &&
          ((inputs.runner_mode == 'aliyun-persistent' && steps.persistent_toolchain.outputs.present != 'true') ||
           (inputs.runner_mode != 'aliyun-persistent' && steps.toolchain_cache.outputs.cache-hit != 'true'))
        shell: bash
        env:
          R2_S3_API_URL: ${{ secrets.R2_S3_API_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_INSTALLER_KEY: ${{ secrets.R2_INSTALLER_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMD_USERNAME: ${{ secrets.AMD_USERNAME }}
          AMD_PASSWORD: ${{ secrets.AMD_PASSWORD }}
        run: bash ci/vivado/install-vivado.sh
      - name: Activate existing AMD FPGA toolchain
        if: >-
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true') &&
          ((inputs.runner_mode == 'aliyun-persistent' && steps.persistent_toolchain.outputs.present == 'true') ||
           (inputs.runner_mode != 'aliyun-persistent' && steps.toolchain_cache.outputs.cache-hit == 'true'))
        shell: bash
        env:
          AMD_TOOLCHAIN_PRESENT: 1
        run: bash ci/vivado/install-vivado.sh
      - name: Pack AMD FPGA toolchain cache
        if: >-
          inputs.runner_mode != 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true') &&
          steps.toolchain_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/vivado/toolchain-cache.sh pack \
            "$XILINX_INSTALL_ROOT" \
            "$GITHUB_WORKSPACE/.toolchains/cache" \
            "$GITHUB_RUN_ID"
      - name: Save AMD FPGA toolchain cache
        if: >-
          inputs.runner_mode != 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true') &&
          steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/vivado-cache-save
        with:
          key: ${{ steps.amd_cache.outputs.key }}
          generation: ${{ github.run_id }}
      - name: Clear toolchain cache staging
        if: >-
          always() && inputs.runner_mode != 'aliyun-persistent' &&
          (inputs.toolchain_only == true || inputs.debug_enabled == true ||
           steps.hardware_cache_state.outputs.valid != 'true')
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/.toolchains/cache"
      - name: Resolve legacy FPGA cache identity
        if: >-
          inputs.toolchain_only != true &&
          steps.hardware_cache_state.outputs.valid != 'true'
        id: fpga_cache_identity
        shell: bash
        run: |
          set -euo pipefail
          source "$VIVADO_SETTINGS"
          python tools/fpga_cache.py identity \
            --vivado vivado \
            --output "$RUNNER_TEMP/fpga-cache-identity.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Restore legacy FPGA build bundle
        if: >-
          inputs.toolchain_only != true &&
          steps.hardware_cache_state.outputs.valid != 'true'
        id: fpga_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/antsdr-e310-fpga-cache
          key: ${{ steps.fpga_cache_identity.outputs.key }}
      - name: Validate legacy FPGA build bundle
        if: >-
          inputs.toolchain_only != true &&
          steps.hardware_cache_state.outputs.valid != 'true'
        id: fpga_cache_state
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [ "${{ steps.fpga_cache.outputs.cache-hit }}" = true ] && \
             python tools/fpga_cache.py validate \
               --bundle "$RUNNER_TEMP/antsdr-e310-fpga-cache" \
               --identity "$RUNNER_TEMP/fpga-cache-identity.json"; then
            valid=true
          else
            rm -rf "$RUNNER_TEMP/antsdr-e310-fpga-cache"
          fi
          printf 'valid=%s\n' "$valid" >> "$GITHUB_OUTPUT"
      - name: Record hardware build provenance
        if: inputs.toolchain_only != true
        shell: bash
        run: |
          python tools/hardware_cache.py annotate \
            --metadata "$RUNNER_TEMP/build-metadata.json" \
            --identity "$RUNNER_TEMP/hardware-cache-identity.json"
      - name: Temporary Vivado debug shell
        if: github.event_name == 'workflow_dispatch' && inputs.debug_enabled
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 45
      - name: Build Linux, Buildroot, U-Boot, FPGA and BOOT.BIN
        if: inputs.toolchain_only != true && inputs.debug_enabled != true
        shell: bash
        env:
          UENV_MODE: ${{ inputs.uenv_mode || 'compat' }}
          FIT_SIGNING_KEY_PEM: ${{ secrets.FIT_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ "${{ steps.hardware_cache_state.outputs.valid }}" != true ]; then
            source "$VIVADO_SETTINGS"
          fi
          workspace="$ANTSDR_BUILD_ROOT/e310"
          jobs="$(nproc)"
          case "$jobs" in
            ''|*[!0-9]*)
              printf 'unable to determine a positive CPU count: %s\n' "$jobs" >&2
              exit 1
              ;;
          esac
          export ADI_HDL_DIR="$workspace/src/hdl"
          export ANTSDR_OS_VERSION="$ANTSDR_VERSION"
          export ADI_USE_OOC_SYNTHESIS=y
          export ADI_MAX_OOC_JOBS=4
          export MODE=default
          unset ADI_NO_BITSTREAM_COMPRESSION ADI_IGNORE_VERSION_CHECK CFG
          signing_args=()
          hardware_cache_args=()
          fpga_cache_args=()
          if [ "${{ steps.hardware_cache_state.outputs.valid }}" = true ]; then
            hardware_cache_args=(
              --hardware-cache-bundle "$RUNNER_TEMP/antsdr-e310-hardware-cache"
              --hardware-cache-identity "$RUNNER_TEMP/hardware-cache-identity.json"
            )
          elif [ "${{ steps.fpga_cache_state.outputs.valid }}" = true ]; then
            fpga_cache_args=(
              --fpga-cache-bundle "$RUNNER_TEMP/antsdr-e310-fpga-cache"
              --fpga-cache-identity "$RUNNER_TEMP/fpga-cache-identity.json"
            )
          fi
          if [ "${{ inputs.release_signing }}" = true ]; then
            test -n "$FIT_SIGNING_KEY_PEM"
            key_dir="$RUNNER_TEMP/fit-signing-key"
            install -d -m 700 "$key_dir"
            printf '%s' "$FIT_SIGNING_KEY_PEM" > "$key_dir/antsdr-os-release.key"
            chmod 600 "$key_dir/antsdr-os-release.key"
            cp keys/fit/antsdr-os-release.crt "$key_dir/antsdr-os-release.crt"
            signing_args=(--fit-signing-key-dir "$key_dir")
          fi
          python tools/e310_build.py all \
            --workspace "$workspace" \
            --jobs "$jobs" \
            --uenv-mode "$UENV_MODE" \
            --xsct "$GITHUB_WORKSPACE/ci/vivado/xsct-headless.sh" \
            --release "$RUNNER_TEMP/antsdr-e310-release" \
            "${signing_args[@]}" \
            "${hardware_cache_args[@]}" \
            "${fpga_cache_args[@]}" \
            --execute
          if [ "${{ inputs.release_signing }}" = true ]; then
            python tools/verify_fit_profiles.py \
              --fit "$RUNNER_TEMP/antsdr-e310-release/common/antsdr-e310.itb" \
              --control-dtb "$workspace/out/u-boot/dts/dt.dtb" \
              --fit-check-sign "$workspace/out/u-boot/tools/fit_check_sign"
          fi
      - name: Pack FPGA and FSBL bundle
        if: >-
          inputs.toolchain_only != true && inputs.debug_enabled != true &&
          steps.hardware_cache_state.outputs.valid != 'true'
        shell: bash
        run: |
          python tools/hardware_cache.py pack \
            --workspace "$ANTSDR_BUILD_ROOT/e310" \
            --bundle "$RUNNER_TEMP/antsdr-e310-hardware-cache" \
            --identity "$RUNNER_TEMP/hardware-cache-identity.json"
      - name: Save FPGA and FSBL bundle
        if: >-
          inputs.toolchain_only != true && inputs.debug_enabled != true &&
          steps.hardware_cache_state.outputs.valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/antsdr-e310-hardware-cache
          key: ${{ steps.hardware_cache_identity.outputs.key }}
      - name: Clear hardware cache staging
        if: always() && inputs.toolchain_only != true
        shell: bash
        run: rm -rf "$RUNNER_TEMP/antsdr-e310-hardware-cache" "$RUNNER_TEMP/antsdr-e310-fpga-cache"
      - name: Remove FIT signing private key
        if: always() && inputs.release_signing
        shell: bash
        run: rm -rf "$RUNNER_TEMP/fit-signing-key"
      - name: Report build diagnostics
        if: failure() && inputs.toolchain_only != true && inputs.debug_enabled != true
        shell: bash
        run: |
          set -euo pipefail
          hdl="$ANTSDR_BUILD_ROOT/e310/src/hdl"
          project_log="$hdl/projects/e310/e310_vivado.log"
          bitstream="$hdl/projects/e310/e310.runs/impl_1/system_top.bit"
          if [ -s "$bitstream" ]; then
            printf 'FPGA bitstream was generated; the build failed in a later stage.\n'
          elif [ -r "$project_log" ]; then
            tail -n 1000 "$project_log"
          else
            mapfile -t ip_logs < <(find "$hdl/library" -type f -name '*_ip.log' -print 2>/dev/null | sort)
            if ((${#ip_logs[@]} == 0)); then
              printf 'No FPGA diagnostic log was created under %s\n' "$hdl" >&2
            else
              for log in "${ip_logs[@]}"; do
                printf '\n==> %s\n' "$log"
                tail -n 250 "$log"
              done
            fi
          fi
      - name: Attach build metadata and verify assembly
        if: inputs.toolchain_only != true && inputs.debug_enabled != true
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/antsdr-e310-release"
          cp "$RUNNER_TEMP/build-metadata.json" "$release/build-metadata.json"
          python tools/verify_release.py --release "$release" --board e310
          mkdir -p "$RUNNER_TEMP/antsdr-e310-package/release"
          cp -a "$release/." "$RUNNER_TEMP/antsdr-e310-package/release/"
      - name: Upload unmodified build output
        if: inputs.toolchain_only != true && inputs.debug_enabled != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/antsdr-e310-package
          if-no-files-found: error
          retention-days: 14
