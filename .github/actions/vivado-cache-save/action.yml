# SPDX-License-Identifier: MIT
name: Save AMD FPGA toolchain cache
description: Save a verified segmented ANTSDR OS Vivado toolchain cache

inputs:
  key:
    description: Stable toolchain installation ABI cache key
    required: true
  generation:
    description: Unique numeric cache generation
    required: true

runs:
  using: composite
  steps:
    - name: Save declared cache segments
      uses: ./.github/actions/vivado-cache-transfer
      with:
        mode: save
        key: ${{ inputs.key }}
        generation: ${{ inputs.generation }}
        cache-root: ${{ github.workspace }}/.toolchains/cache
