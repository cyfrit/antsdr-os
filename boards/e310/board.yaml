  microphase_hdl_e310:
    kind: vendor-patch-result
    repository: https://github.com/MicroPhase/antsdr-fw-patch.git
    commit: 58b8018d596121c220f30e00749bafbe251744a6
    path: patch/0001-add-three-ant-hdl-support-bump-to-v0.39.patch
    target: projects/ant
  microphase_hdl_project:
    kind: vendor-patch-result
    repository: https://github.com/MicroPhase/antsdr-fw-patch.git
    commit: 58b8018d596121c220f30e00749bafbe251744a6
    path: patch/0001-add-three-ant-hdl-support-bump-to-v0.39.patch
    target: projects/ant/system_project.tcl
    lines: 1-15
  microphase_hdl_ps7:
    kind: vendor-patch-result
    repository: https://github.com/MicroPhase/antsdr-fw-patch.git
    commit: 58b8018d596121c220f30e00749bafbe251744a6
    path: patch/0001-add-three-ant-hdl-support-bump-to-v0.39.patch
    target: projects/ant/system_bd.tcl
    lines: 46-92
  microphase_hdl_ad936x:
    kind: vendor-patch-result
    repository: https://github.com/MicroPhase/antsdr-fw-patch.git
    commit: 58b8018d596121c220f30e00749bafbe251744a6
    path: patch/0001-add-three-ant-hdl-support-bump-to-v0.39.patch
    target: projects/ant/system_bd.tcl
    lines: 173-376
  microphase_hdl_top:
    kind: vendor-patch-result
    repository: https://github.com/MicroPhase/antsdr-fw-patch.git
    commit: 58b8018d596121c220f30e00749bafbe251744a6
